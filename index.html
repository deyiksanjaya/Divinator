<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#2d1331">
    <title>Divinator App</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,700&family=Lora:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="manifest" href="/manifest.json">
    <style>
        :root {
            --bg-top: #4a244c;
            --bg-bottom: #2d1331;
        }
        html, body {
            overscroll-behavior: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; /* Mematikan delay tap 300ms di mobile */
        }

        body {
            font-family: 'Lora', serif;
            background-color: var(--bg-bottom);
            color: white;
            margin: 0;
        }

        .font-logo { font-family: 'Playfair Display', serif; }

        .akinator-logo-text {
            background: linear-gradient(180deg, #fff5b5 0%, #f7b733 40%, #d87c00 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0px 3px 2px rgba(0,0,0,0.6));
            -webkit-text-stroke: 0.5px white;
        }

        .btn-gold-3d {
            background: linear-gradient(180deg, #ffdf6b 0%, #d8a02c 100%);
            border-top: 2px solid #fff5b5;
            border-left: 2px solid #fff5b5;
            border-right: 2px solid #9e6d15;
            border-bottom: 4px solid #81560e;
            text-shadow: 0px 1px 0px rgba(255,255,255,0.4);
            color: #351e02;
            transition: transform 0.1s, background-color 0.1s;
        }
        .btn-gold-3d:active {
            background: linear-gradient(180deg, #d8a02c 0%, #ffdf6b 100%);
            border-top: 4px solid #81560e;
            border-bottom: 2px solid #fff5b5;
            transform: translateY(2px);
        }
        
        .btn-locked-horror {
            background: linear-gradient(180deg, #6b0000 0%, #300000 100%) !important;
            border-top: 2px solid #ff4d4d !important;
            border-left: 2px solid #ff4d4d !important;
            border-right: 2px solid #4a0000 !important;
            border-bottom: 4px solid #200000 !important;
            color: #ffcccc !important;
            text-shadow: 0px 1px 5px rgba(255,0,0,0.8) !important;
        }

        .speech-bubble {
            background: linear-gradient(180deg, rgba(255,255,255,0.95) 0%, rgba(240,230,239,0.9) 100%);
            box-shadow: 0 -10px 20px rgba(0,0,0,0.15);
        }

        .hidden-screen { display: none !important; }

        .fade-in { animation: fadeIn 0.3s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .spinner {
            border: 4px solid rgba(255, 255, 255, 0.3);
            border-top: 4px solid #f7b733;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

        @keyframes shakeT9 {
            0%, 100% { transform: translateX(0); }
            20% { transform: translateX(-6px); }
            40% { transform: translateX(6px); }
            60% { transform: translateX(-6px); }
            80% { transform: translateX(6px); }
        }
        .animate-shake { animation: shakeT9 0.4s ease-in-out; }
        
        #loading-overlay, #settings-modal, #t9-modal {
            background: rgba(45, 19, 49, 0.85);
            backdrop-filter: blur(5px);
        }

        textarea::-webkit-scrollbar { width: 4px; }
        textarea::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.1); }
        textarea::-webkit-scrollbar-thumb { background: rgba(247, 183, 51, 0.5); border-radius: 4px; }

        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.2); border-radius: 4px; }

        input, textarea, select {
            touch-action: auto;
            -webkit-user-select: text;
            user-select: text;
        }

        /* GLITCH EFFECTS */
        .glitch-extreme {
            animation: extremeGlitch 0.25s infinite steps(2) !important;
            pointer-events: none;
        }
        .glitch-extreme::before {
            content: ""; position: fixed; inset: 0;
            background: repeating-linear-gradient(0deg, rgba(0,0,0,0.9), rgba(0,0,0,0.9) 2px, transparent 2px, transparent 5px);
            z-index: 9998; pointer-events: none; mix-blend-mode: overlay;
        }
        .glitch-extreme::after {
            content: ""; position: fixed; inset: 0; z-index: 9999; pointer-events: none;
            mix-blend-mode: color-burn; animation: panicFlicker 0.1s infinite steps(1);
        }

        @keyframes extremeGlitch {
            0% { transform: translate(0, 0); filter: invert(0) contrast(100%); }
            10% { transform: translate(-10px, 5px) scale(1.05); filter: invert(100%) contrast(300%) drop-shadow(15px 0 0 red) drop-shadow(-15px 0 0 blue); }
            20% { transform: translate(15px, -10px); filter: hue-rotate(90deg) saturate(300%); }
            30% { transform: translate(-5px, 15px) skew(15deg); filter: invert(1) drop-shadow(-10px 0 0 lime); }
            40% { transform: translate(20px, -5px) skew(-15deg); filter: contrast(1000%) saturate(500%); }
            50% { transform: translate(0, 10px); filter: brightness(10%) contrast(2000%); }
            60% { transform: translate(-20px, -10px); filter: invert(1) hue-rotate(-50deg) drop-shadow(0 15px 0 red); }
            70% { transform: translate(10px, 20px) scale(1.1); filter: contrast(400%); }
            80% { transform: translate(-25px, -5px); filter: invert(1) hue-rotate(180deg); }
            90% { transform: translate(15px, 10px) skew(10deg); filter: saturate(1000%); }
            100% { transform: translate(0, 0); filter: invert(0) contrast(100%); }
        }

        .glitch-mild {
            animation: mildGlitch 0.2s infinite;
            filter: saturate(130%) contrast(110%);
        }
        .glitch-mild::after {
            content: ""; position: fixed; inset: 0; z-index: 9999;
            background: rgba(255,0,0,0.05); mix-blend-mode: color-burn; pointer-events: none;
            animation: mildFlicker 0.1s infinite;
        }

        @keyframes mildGlitch {
            0% { transform: translate(0, 0); filter: hue-rotate(0deg); }
            25% { transform: translate(-2px, 1px); filter: hue-rotate(5deg); }
            50% { transform: translate(1px, -1px); filter: hue-rotate(-2deg); }
            75% { transform: translate(-1px, 2px); filter: hue-rotate(3deg); }
            100% { transform: translate(0, 0); filter: hue-rotate(0deg); }
        }

        @keyframes panicFlicker {
            0% { opacity: 0.1; background: #000; }
            33% { opacity: 0.9; background: #3b0000; }
            66% { opacity: 0.4; background: #fff; }
            100% { opacity: 0.2; background: #000; }
        }
        
        .typewriter-text {
            border-right: 2px solid rgba(0,0,0,0.5);
            animation: cursorBlink 0.8s infinite;
        }
        @keyframes cursorBlink {
            0%, 100% { border-color: transparent; }
            50% { border-color: rgba(0,0,0,0.8); }
        }
        
        /* Utility for touch keys to avoid active state sticky on mobile */
        .t9-btn { touch-action: manipulation; }
    </style>
</head>
<body class="overflow-hidden h-screen h-[100dvh] w-screen m-0 flex flex-col bg-[var(--bg-bottom)] relative">

    <div id="error-dot" class="hidden fixed top-[max(1rem,env(safe-area-inset-top))] right-4 w-3 h-3 bg-red-600 rounded-full shadow-[0_0_10px_rgba(255,0,0,0.8)] z-[9999]"></div>

    <img src="https://raw.githubusercontent.com/deyiksanjaya/akeynator/refs/heads/main/IMG_0854.jpeg" 
         alt="Background" 
         class="fixed inset-0 w-full h-full object-cover z-0 pointer-events-none">

    <div id="loading-overlay" class="fixed inset-0 z-[100] flex flex-col items-center justify-center hidden-screen">
        <div class="spinner mb-4"></div>
        <p data-i18n="loading" class="font-logo text-xl font-bold text-[#f7b733] tracking-wider drop-shadow-md text-center px-6 uppercase tracking-widest">Loading...</p>
    </div>

    <!-- T9 Modal (Absolute di pojok) -->
    <div id="t9-modal" class="fixed inset-0 z-[300] hidden-screen fade-in">
        <div id="t9-box" class="absolute bottom-[max(1.5rem,env(safe-area-inset-bottom))] bg-black/90 border border-[#f7b733]/40 p-4 rounded-2xl shadow-2xl w-60 backdrop-blur-md flex flex-col transition-all duration-300 z-10">
            <div id="t9-display" class="text-[#f7b733] text-right h-8 mb-2 tracking-widest text-2xl font-mono border-b border-white/20 pb-1 transition-colors"></div>
            
            <div id="t9-target-name" class="text-green-400 font-bold text-center text-[10px] tracking-widest uppercase mb-4 h-4 opacity-0 transition-opacity"></div>
            
            <!-- Menggunakan ontouchstart dan onmousedown untuk bypass delay click di browser -->
            <div class="grid grid-cols-3 gap-2">
                <button onclick="t9Press('1')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">1</button>
                <button onclick="t9Press('2')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">2</button>
                <button onclick="t9Press('3')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">3</button>
                <button onclick="t9Press('4')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">4</button>
                <button onclick="t9Press('5')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">5</button>
                <button onclick="t9Press('6')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">6</button>
                <button onclick="t9Press('7')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">7</button>
                <button onclick="t9Press('8')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">8</button>
                <button onclick="t9Press('9')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">9</button>
                <button onclick="t9Clear()" class="t9-btn bg-red-500/20 py-3 rounded-xl active:bg-red-500/40 text-red-400 font-bold text-sm transition-colors">DEL</button>
                <button onclick="t9Press('0')" class="t9-btn bg-white/10 py-3 rounded-xl active:bg-white/30 text-white font-bold text-lg transition-colors">0</button>
                <div class="py-3"></div>
            </div>
            <button data-i18n="closeBtn" onclick="closeT9()" class="t9-btn w-full mt-2 text-white/40 text-xs uppercase tracking-widest py-2 active:text-white transition-colors">Tutup</button>
        </div>
    </div>

    <!-- SETTINGS MODAL -->
    <div id="settings-modal" class="fixed inset-0 z-[200] flex items-center justify-center hidden-screen p-4 fade-in">
        <div class="bg-[#2d1331] w-full max-w-sm rounded-xl border-2 border-[#f7b733] shadow-2xl flex flex-col max-h-[90dvh]">
            <div class="p-5 overflow-y-auto overscroll-contain allow-scroll" style="touch-action: pan-y;">
                <div class="flex items-center gap-2 border-b border-[#f7b733]/30 pb-2 mb-4">
                    <svg class="w-6 h-6 text-[#f7b733]" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                    <h2 data-i18n="settingsTitle" class="text-[#f7b733] font-logo text-2xl font-bold tracking-tight">Pengaturan</h2>
                </div>
                
                <!-- Bahasa -->
                <div class="mb-4 bg-black/20 p-3 rounded-lg border border-[#f7b733]/50">
                    <label data-i18n="langLabel" class="block text-[#f7b733] text-xs mb-2 uppercase tracking-wider font-bold">Bahasa / Language</label>
                    <select id="input-language" class="w-full p-2.5 rounded bg-white/90 text-black text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#f7b733]">
                        <option value="id">Indonesian (ID)</option>
                        <option value="en">English (EN)</option>
                    </select>
                </div>

                <div class="mb-4 bg-black/20 p-3 rounded-lg border border-red-500/30">
                    <label data-i18n="apiKeyLabel" class="block text-white/80 text-xs mb-1 uppercase tracking-wider font-bold text-red-300">Gemini API Key (Wajib)</label>
                    <input type="password" id="input-api-key" placeholder="Masukkan API Key" class="w-full p-2.5 rounded bg-white/90 text-black focus:outline-none focus:ring-2 focus:ring-[#f7b733] mb-2">
                    
                    <label data-i18n="modelLabel" class="block text-white/80 text-xs mb-1 uppercase tracking-wider font-bold text-red-300">Model Gemini</label>
                    <input type="text" id="input-ai-model" placeholder="gemini-2.5-flash" class="w-full p-2.5 rounded bg-white/90 text-black text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#f7b733]">
                </div>

                <div class="mb-4 bg-black/20 p-3 rounded-lg border border-white/10">
                    <label data-i18n="charListLabel" class="block text-white/80 text-xs mb-2 uppercase tracking-wider">List Karakter Target</label>
                    <p data-i18n="charListDesc" class="text-[10px] text-[#f7b733] mb-2 leading-tight opacity-80">Pisahkan tiap nama dengan baris baru (Enter). Baris 1 akan dipanggil dengan angka 01, baris 100 dengan angka 00.</p>
                    <textarea id="input-character-list" rows="8" class="w-full p-2.5 rounded bg-white/90 text-black text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#f7b733] allow-scroll whitespace-pre" style="line-height: 1.5;"></textarea>
                </div>

                <div class="mb-4 bg-black/20 p-3 rounded-lg border border-white/10">
                    <label data-i18n="t9PosLabel" class="block text-white/80 text-xs mb-2 uppercase tracking-wider">Posisi T9 Keypad</label>
                    <select id="input-t9-position" class="w-full p-2.5 rounded bg-white/90 text-black text-sm font-semibold focus:outline-none focus:ring-2 focus:ring-[#f7b733]">
                        <option value="right" data-i18n="posRight">Kanan Bawah</option>
                        <option value="left" data-i18n="posLeft">Kiri Bawah</option>
                    </select>
                </div>

                <div class="mb-2 bg-black/20 p-3 rounded-lg border border-white/10">
                    <label data-i18n="glitchDelayLabel" class="block text-white/80 text-xs mb-3 uppercase tracking-wider">Glitch Transfer (Detik)</label>
                    <div class="flex gap-3">
                        <div class="flex-1 flex flex-col items-center gap-1">
                            <span data-i18n="delayLabel" class="text-white/50 text-[10px] uppercase tracking-widest">Delay</span>
                            <div class="flex items-center w-full bg-white/10 rounded-lg overflow-hidden border border-white/20">
                                <button type="button" onclick="stepperChange('glitch-delay', -0.5)" class="w-10 h-10 flex items-center justify-center text-[#f7b733] text-xl font-bold active:bg-white/20 transition-colors shrink-0">&#8722;</button>
                                <span id="input-glitch-delay" class="flex-1 text-center text-white font-bold text-base">0</span>
                                <button type="button" onclick="stepperChange('glitch-delay', 0.5)" class="w-10 h-10 flex items-center justify-center text-[#f7b733] text-xl font-bold active:bg-white/20 transition-colors shrink-0">+</button>
                            </div>
                        </div>
                        <div class="flex-1 flex flex-col items-center gap-1">
                            <span data-i18n="durationLabel" class="text-white/50 text-[10px] uppercase tracking-widest">Durasi</span>
                            <div class="flex items-center w-full bg-white/10 rounded-lg overflow-hidden border border-white/20">
                                <button type="button" onclick="stepperChange('glitch-duration', -0.5)" class="w-10 h-10 flex items-center justify-center text-[#f7b733] text-xl font-bold active:bg-white/20 transition-colors shrink-0">&#8722;</button>
                                <span id="input-glitch-duration" class="flex-1 text-center text-white font-bold text-base">1.5</span>
                                <button type="button" onclick="stepperChange('glitch-duration', 0.5)" class="w-10 h-10 flex items-center justify-center text-[#f7b733] text-xl font-bold active:bg-white/20 transition-colors shrink-0">+</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="p-4 border-t border-[#f7b733]/30 flex justify-end gap-3 shrink-0">
                <button data-i18n="closeBtn" type="button" class="px-5 py-2 bg-white/10 rounded-lg text-white font-bold" onclick="closeSettings()">Tutup</button>
                <button data-i18n="saveBtn" type="button" class="px-5 py-2 bg-gradient-to-r from-[#f7b733] to-[#d87c00] text-[#2d1331] font-black rounded-lg shadow-lg active:scale-95 transition-transform" onclick="saveSettings()">Simpan</button>
            </div>
        </div>
    </div>

    <div id="main-app-container" class="flex-grow w-full max-w-md mx-auto flex flex-col relative z-10 transition-all duration-75">

        <!-- ================= START SCREEN ================= -->
        <section id="screen-start" class="flex flex-col flex-grow fade-in w-full">
            <header class="flex justify-between items-center px-6 pt-[max(1.5rem,env(safe-area-inset-top))] pb-4 shrink-0">
                <button type="button" class="w-10 h-10 rounded-full flex items-center justify-center active:bg-white/10 transition-colors" onclick="openSettings()">
                    <svg class="w-8 h-8 text-[#f7b733] drop-shadow-md" fill="currentColor" viewBox="0 0 24 24"><path d="M19.14,12.94c0.04-0.3,0.06-0.61,0.06-0.94c0-0.32-0.02-0.64-0.06-0.94l2.03-1.58c0.18-0.14,0.23-0.41,0.12-0.61 l-1.92-3.32c-0.12-0.22-0.37-0.29-0.59-0.22l-2.39,0.96c-0.5-0.38-1.03-0.7-1.62-0.94L14.4,2.81c-0.04-0.24-0.24-0.41-0.48-0.41 h-3.84c-0.24,0-0.43,0.17-0.47,0.41L9.25,5.35C8.66,5.59,8.12,5.92,7.63,6.29L5.24,5.33c-0.22-0.08-0.47,0-0.59,0.22L2.73,8.87 C2.62,9.08,2.66,9.34,2.86,9.48l2.03,1.58C4.84,11.36,4.8,11.69,4.8,12s0.02,0.64,0.06,0.94l-2.03,1.58 c-0.18,0.14-0.23,0.41-0.12,0.61l1.92,3.32c0.12,0.22,0.37,0.29,0.59,0.22l2.39-0.96c0.5,0.38,1.03,0.7,1.62,0.94l0.36,2.54 c0.05,0.24,0.24,0.41,0.48,0.41h3.84c0.24,0,0.43-0.17,0.47-0.41l0.36-2.54c0.59-0.24,1.13-0.56,1.62-0.94l2.39,0.96 c0.22,0.08,0.47,0,0.59-0.22l1.92-3.32c0.12-0.22,0.07-0.49-0.12-0.61L19.14,12.94z M12,15.6c-1.98,0-3.6-1.62-3.6-3.6 s1.62-3.6,3.6-3.6s3.6,1.62,3.6,3.6S13.98,15.6,12,15.6z"/></svg>
                </button>
                <h1 class="font-logo text-4xl font-black akinator-logo-text tracking-wide">akinator</h1>
                <div class="w-10 h-10"></div> 
            </header>

            <div class="flex-grow flex justify-center items-center relative px-4 z-10 min-h-0">
                <img src="genie.PNG" alt="Akinator" class="w-full h-full max-h-[100vh] object-contain drop-shadow-[0_15px_15px_rgba(0,0,0,0.5)] z-10 cursor-pointer transition-transform active:scale-95 touch-manipulation" onclick="handleImageClick()">
            </div>

            <div class="w-full flex flex-col items-center z-30 pt-4 pb-[max(0.5rem,env(safe-area-inset-bottom))] shrink-0">
                <button type="button" class="btn-gold-3d w-[85%] max-w-[320px] py-4 rounded-xl flex flex-col items-center justify-center shadow-[0_10px_20px_rgba(0,0,0,0.5)] relative z-30" onclick="startGame()">
                    <span data-i18n="challengeBtn" class="font-logo font-black text-2xl tracking-wide uppercase">Challenge me</span>
                    <span data-i18n="readMindSub" class="font-sans text-[11px] font-bold text-[#4d320d] uppercase mt-1 tracking-wider">I will read your mind.</span>
                </button>
            </div>
        </section>

        <!-- ================= GAME SCREEN ================= -->

    <script>
        // Dictionary Bahasa (I18N)
        const i18n = {
            id: {
                loading: "Memuat...", settingsTitle: "Pengaturan", langLabel: "Bahasa / Language", apiKeyLabel: "Gemini API Key (Wajib)", 
                modelLabel: "Model Gemini", charListLabel: "List Karakter Target", charListDesc: "Pisahkan tiap nama dengan baris baru (Enter). Baris 1 = 01, baris 100 = 00.",
                t9PosLabel: "Posisi T9 Keypad", posRight: "Kanan Bawah", posLeft: "Kiri Bawah", glitchDelayLabel: "Glitch Transfer (Detik)",
                delayLabel: "Delay", durationLabel: "Durasi", closeBtn: "Tutup", saveBtn: "Simpan",
                challengeBtn: "Challenge me", readMindSub: "Saya akan membaca pikiranmu.",
                qProbably: "Mungkin", qProbablyNot: "Mungkin Tidak", qYes: "Ya", qDontKnow: "Tidak Tahu", qNo: "Tidak",
                thinkingTitle: "Saya berpikir tentang...", noImage: "Tanpa Gambar", amIRight: "Apakah saya benar?",
                btnYes: "Ya", btnNo: "Tidak", endWin: "SAYA HEBAT!", endLose: "KAMU MENANG!", playAgain: "Main Lagi",
                magicDesc: "Terbaca dari pikiranmu.", question: "Pertanyaan"
            },
            en: {
                loading: "Loading...", settingsTitle: "Settings", langLabel: "Language / Bahasa", apiKeyLabel: "Gemini API Key (Required)",
                modelLabel: "Gemini Model", charListLabel: "Target Character List", charListDesc: "Separate each name with a new line (Enter). Line 1 = 01, line 100 = 00.",
                t9PosLabel: "T9 Keypad Position", posRight: "Bottom Right", posLeft: "Bottom Left", glitchDelayLabel: "Glitch Transfer (Seconds)",
                delayLabel: "Delay", durationLabel: "Duration", closeBtn: "Close", saveBtn: "Save",
                challengeBtn: "Challenge me", readMindSub: "I will read your mind.",
                qProbably: "Probably", qProbablyNot: "Probably not", qYes: "Yes", qDontKnow: "Don't know", qNo: "No",
                thinkingTitle: "I am thinking of...", noImage: "No Image", amIRight: "Am I right?",
                btnYes: "Yes", btnNo: "No", endWin: "I'M THE BEST!", endLose: "YOU WIN!", playAgain: "Play Again",
                magicDesc: "Read from your mind.", question: "Question"
            }
        };

        // Mematikan native swipe scale tapi tetap mengizinkan scroll
        document.addEventListener('touchmove', function(event) {
            if (event.scale !== 1) { event.preventDefault(); return; }
            const isScrollableArea = event.target.closest('.allow-scroll') || event.target.closest('.custom-scroll');
            const isInputField = event.target.closest('input, textarea, select');
            if (!isScrollableArea && !isInputField) { event.preventDefault(); }
        }, { passive: false });

        const default50List = "Taylor Swift\nTom Cruise\nLeonardo DiCaprio\nBrad Pitt\nScarlett Johansson\nRobert Downey Jr\nJohnny Depp\nWill Smith\nAngelina Jolie\nDwayne Johnson\nCristiano Ronaldo\nLionel Messi\nJustin Bieber\nSelena Gomez\nKaty Perry\nRihanna\nLady Gaga\nEminem\nChris Hemsworth\nVin Diesel\nKeanu Reeves\nChris Evans\nRyan Reynolds\nZendaya\nTom Holland\nMargot Robbie\nElon Musk\nMark Zuckerberg\nBill Gates\nSteve Jobs\nAriana Grande\nBillie Eilish\nBeyonce\nDrake\nSnoop Dogg\nKanye West\nJay-Z\nEd Sheeran\nBruno Mars\nShawn Mendes\nThe Weeknd\nPost Malone\nKylie Jenner\nKendall Jenner\nKim Kardashian\nEmma Watson\nJennifer Lawrence\nNatalie Portman\nAnne Hathaway\nGal Gadot";

        let config = {
            characterList: default50List,
            customApiKey: "",
            aiModel: "gemini-2.5-flash",
            glitchDelay: "0",
            glitchDuration: "1.5",
            t9Position: "right",
            language: "id"
        };

        let currentQuestionIndex = 0;
        let isGameOver = false;
        let isProcessing = false;
        let isMagicMode = false;
        let isMagicCancelled = false; 
        
        let fetchedMagicName = "";
        let magicDescriptionsString = ""; 
        
        let t9InputString = "";
        let forcedTargetIndex = -1; 
        let waitingForMagicTrigger = false;
        
        let normalChatHistory = [];
        let magicTimeouts = [];
        let magicIntervals = [];
        let streamReader = null;

        let typeQueue = "";
        let streamFinished = false;

        function clearMagicTimeouts() {
            isMagicCancelled = true;
            if (streamReader) {
                try { streamReader.cancel(); } catch(e){}
                streamReader = null;
            }
            magicTimeouts.forEach(clearTimeout);
            magicIntervals.forEach(clearInterval);
            magicTimeouts = [];
            magicIntervals = [];
            typeQueue = "";
        }

        // FUNGSI TRANSLASI UI
        function applyLanguage() {
            const lang = config.language || 'id';
            const dict = i18n[lang];
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (dict[key]) el.innerText = dict[key];
            });
            magicDescriptionsString = dict.magicDesc;
            resetGameUI();
        }

        function applyT9Position() {
            const t9Box = document.getElementById('t9-box');
            if (config.t9Position === 'left') {
                t9Box.classList.remove('right-6');
                t9Box.classList.add('left-6');
            } else {
                t9Box.classList.remove('left-6');
                t9Box.classList.add('right-6');
            }
        }

        function loadSettings() {
            const saved = localStorage.getItem('akinatorSettingsProV6');
            if (saved) {
                const parsed = JSON.parse(saved);
                config = { ...config, ...parsed };
            }
            document.getElementById('input-character-list').value = config.characterList || default50List;
            document.getElementById('input-api-key').value = config.customApiKey || "";
            document.getElementById('input-ai-model').value = config.aiModel || "gemini-2.5-flash"; 
            document.getElementById('input-glitch-delay').innerText = config.glitchDelay || "0";
            document.getElementById('input-glitch-duration').innerText = config.glitchDuration || "1.5";
            document.getElementById('input-t9-position').value = config.t9Position || "right";
            document.getElementById('input-language').value = config.language || "id";
            
            applyT9Position();
            applyLanguage();
        }

        function openSettings() { document.getElementById('settings-modal').classList.remove('hidden-screen'); }
        function closeSettings() { document.getElementById('settings-modal').classList.add('hidden-screen'); loadSettings(); }

        function saveSettings() {
            config.characterList = document.getElementById('input-character-list').value.trim() || default50List;
            config.customApiKey = document.getElementById('input-api-key').value.trim();
            config.aiModel = document.getElementById('input-ai-model').value.trim() || "gemini-2.5-flash";
            config.glitchDelay = document.getElementById('input-glitch-delay').innerText.trim() || "0";
            config.glitchDuration = document.getElementById('input-glitch-duration').innerText.trim() || "1.5";
            config.t9Position = document.getElementById('input-t9-position').value;
            config.language = document.getElementById('input-language').value;
            
            localStorage.setItem('akinatorSettingsProV6', JSON.stringify(config));
            showErrorDot(false);
            applyT9Position();
            applyLanguage();
            closeSettings();
        }

        function openT9() {
            t9InputString = "";
            document.getElementById('t9-display').innerText = "";
            document.getElementById('t9-display').classList.remove('text-red-500', 'animate-shake');
            document.getElementById('t9-target-name').innerText = "";
            document.getElementById('t9-target-name').classList.remove('opacity-100');
            document.getElementById('t9-target-name').classList.add('opacity-0');
            document.getElementById('t9-modal').classList.remove('hidden-screen');
        }

        function closeT9() { document.getElementById('t9-modal').classList.add('hidden-screen'); }

        // FUNGSI T9 - Sekarang Instan!
        let lastT9Hit = 0;
        function t9Press(num) {
            const now = Date.now();
            if (now - lastT9Hit < 50) return; // Debounce kilat
            lastT9Hit = now;

            if (t9InputString.length >= 2) return; 
            t9InputString += num;
            const displayEl = document.getElementById('t9-display');
            displayEl.innerText = t9InputString;
            displayEl.classList.remove('text-red-500', 'animate-shake');
            
            if (navigator.vibrate) navigator.vibrate(10);
            
            if (t9InputString.length === 2) {
                const listArray = config.characterList.split('\n').map(item => item.trim()).filter(item => item.length > 0);
                
                let targetNum = parseInt(t9InputString, 10);
                if (t9InputString === "00") targetNum = 100;
                
                if (targetNum > listArray.length || targetNum === 0) {
                    displayEl.classList.add('text-red-500', 'animate-shake');
                    if (navigator.vibrate) navigator.vibrate([40, 40, 40]);
                    setTimeout(() => {
                        t9InputString = "";
                        displayEl.innerText = "";
                        displayEl.classList.remove('text-red-500', 'animate-shake');
                    }, 500);
                } else {
                    forcedTargetIndex = targetNum - 1;
                    const peekName = listArray[forcedTargetIndex] || "Misterius";
                    const nameDisplay = document.getElementById('t9-target-name');
                    nameDisplay.innerText = peekName;
                    nameDisplay.classList.replace('opacity-0', 'opacity-100');
                    
                    isMagicMode = true; 
                    
                    setTimeout(() => {
                        closeT9();
                        nameDisplay.classList.replace('opacity-100', 'opacity-0');
                        waitingForMagicTrigger = true; 
                    }, 1000);
                }
            }
        }

        function t9Clear() {
            t9InputString = t9InputString.slice(0, -1);
            document.getElementById('t9-display').innerText = t9InputString;
            document.getElementById('t9-display').classList.remove('text-red-500', 'animate-shake');
            if (navigator.vibrate) navigator.vibrate(15);
        }

        function handleImageClick() {
            if (waitingForMagicTrigger) {
                waitingForMagicTrigger = false;
                startMagicSequence();
            } else {
                openT9();
            }
        }

        function startMagicSequence() {
            const delay = (parseFloat(config.glitchDelay) || 0) * 1000;
            const duration = (parseFloat(config.glitchDuration) || 1.5) * 1000;
            
            isProcessing = true;
            
            setTimeout(() => {
                document.body.classList.add('glitch-extreme');
                if (navigator.vibrate) navigator.vibrate([100, 50, 100]);
                
                setTimeout(() => {
                    document.body.classList.remove('glitch-extreme');
                    isProcessing = false; 
                    startGame(); 
                }, duration);
            }, delay);
        }

        // FUNGSI AI Q&A dengan Support Bahasa
        async function fetchNormalQuestion(answer) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${config.aiModel}:generateContent?key=${config.customApiKey}`;
            const lang = config.language || 'id';
            
            if (!answer) {
                normalChatHistory = [{ role: "user", parts: [{ text: i18n[lang].aiPromptInitial }] }];
            } else {
                normalChatHistory.push({ role: "model", parts: [{ text: document.getElementById('question-text').innerText }] });
                let promptNext = lang === 'en' ? `My answer: ${answer}. ${i18n[lang].aiPromptNext}` : `Jawaban saya: ${answer}. ${i18n[lang].aiPromptNext}`;
                normalChatHistory.push({ role: "user", parts: [{ text: promptNext }] });
            }

            try {
                const res = await fetch(apiUrl, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: normalChatHistory }) });
                if (!res.ok) return null;
                const data = await res.json();
                return data.candidates[0].content.parts[0].text.trim().replace(/\*/g, '');
            } catch (e) { return null; }
        }

        async function fetchNormalGuess(answer) {
            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${config.aiModel}:generateContent?key=${config.customApiKey}`;
            const lang = config.language || 'id';
            
            normalChatHistory.push({ role: "model", parts: [{ text: document.getElementById('question-text').innerText }] });
            let promptGuess = lang === 'en' ? `My answer: ${answer}. ${i18n[lang].aiPromptGuess}` : `Jawaban saya: ${answer}. ${i18n[lang].aiPromptGuess}`;
            normalChatHistory.push({ role: "user", parts: [{ text: promptGuess }] });

            try {
                const res = await fetch(apiUrl, { method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({ contents: normalChatHistory, generationConfig: { responseMimeType: "application/json" } }) });
                if (!res.ok) return null;
                const data = await res.json();
                const text = data.candidates[0].content.parts[0].text;
                const cleanJson = text.replace(/```json/gi, '').replace(/```/g, '').trim();
                return JSON.parse(cleanJson);
            } catch (e) { return null; }
        }

        function assignTarget() {
            const listArray = config.characterList.split('\n').map(item => item.trim()).filter(item => item.length > 0);
            if (listArray.length === 0) { fetchedMagicName = "Karakter Misterius"; return; }

            if (forcedTargetIndex >= 0) {
                fetchedMagicName = listArray[forcedTargetIndex];
            } else {
                fetchedMagicName = listArray[Math.floor(Math.random() * listArray.length)];
            }
        }

        async function fetchCharacterImageFromInternet(characterName) {
            try {
                let res = await fetch(`https://id.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(characterName)}&prop=pageimages&format=json&pithumbsize=400&origin=*`);
                let data = await res.json();
                let pages = data.query.pages;
                let pageId = Object.keys(pages)[0];
                if (pageId !== "-1" && pages[pageId].thumbnail) {
                    return pages[pageId].thumbnail.source;
                }

                res = await fetch(`https://en.wikipedia.org/w/api.php?action=query&titles=${encodeURIComponent(characterName)}&prop=pageimages&format=json&pithumbsize=400&origin=*`);
                data = await res.json();
                pages = data.query.pages;
                pageId = Object.keys(pages)[0];
                if (pageId !== "-1" && pages[pageId].thumbnail) {
                    return pages[pageId].thumbnail.source;
                }

                return null;
            } catch (e) { return null; }
        }

        function showScreen(screenId) {
            ['screen-start', 'screen-game', 'screen-guess', 'screen-end'].forEach(id => {
                const el = document.getElementById(id);
                el.classList.add('hidden-screen');
                el.classList.remove('flex');
            });
            const targetEl = document.getElementById(screenId);
            targetEl.classList.remove('hidden-screen');
            targetEl.classList.add('flex');
        }

        function showLoading(show) { document.getElementById('loading-overlay').classList.toggle('hidden-screen', !show); }
        function showErrorDot(show) { document.getElementById('error-dot').classList.toggle('hidden', !show); }

        function resetGameUI() {
            const lang = config.language || 'id';
            const dict = i18n[lang];
            const buttons = document.querySelectorAll('#answer-buttons-container button');
            const defaultLabels = [dict.qProbably, dict.qProbablyNot, dict.qYes, dict.qDontKnow, dict.qNo];
            
            buttons.forEach((btn, index) => {
                btn.classList.remove('btn-locked-horror');
                btn.innerText = defaultLabels[index];
                delete btn.dataset.locked;
            });
            
            document.getElementById('answer-buttons-container').classList.remove('pointer-events-none', 'opacity-50');
            document.getElementById('question-number').style.display = 'block';
            document.getElementById('question-text').classList.remove('typewriter-text');
            document.getElementById('question-text').classList.remove('text-left');
            document.getElementById('question-text').classList.add('text-center');
            document.getElementById('screen-game').style.opacity = '1';
        }

        async function startGame() {
            if (isProcessing) return;

            if (!config.customApiKey) { showErrorDot(true); return; }
            
            if (isMagicMode) {
                assignTarget();
                currentQuestionIndex = 0;
                isGameOver = false;
                resetGameUI();
                showScreen('screen-game');
                streamMagicClimax(); 
            } else {
                showLoading(true);
                const firstQ = await fetchNormalQuestion(null);
                showLoading(false);

                if (!firstQ) { showErrorDot(true); return; }
                
                currentQuestionIndex = 0; 
                isGameOver = false;
                isProcessing = false;
                
                resetGameUI();
                document.getElementById('question-text').innerText = firstQ;
                document.getElementById('question-number').innerText = `${i18n[config.language || 'id'].question} 1`;
                showScreen('screen-game');
            }
        }

        async function processTypeQueue() {
            if (isMagicCancelled) return;
            
            const qText = document.getElementById('question-text');
            
            if (typeQueue.length > 0) {
                const char = typeQueue[0];
                typeQueue = typeQueue.substring(1);
                
                if (char === '\n') {
                    qText.innerHTML += '<br>';
                    qText.scrollTop = qText.scrollHeight; 
                    await new Promise(r => { let id = setTimeout(r, 600); magicTimeouts.push(id); }); 
                } else {
                    if (char !== '*') {
                        qText.innerHTML += char;
                        qText.scrollTop = qText.scrollHeight; 
                    }
                }
                
                const speed = Math.random() * 40 + 20; 
                let tid = setTimeout(processTypeQueue, speed);
                magicTimeouts.push(tid);
            } else {
                if (streamFinished) {
                    document.body.classList.remove('glitch-mild');
                    qText.classList.remove('typewriter-text');
                    
                    magicTimeouts.push(setTimeout(() => {
                        if (!isMagicCancelled) showReveal();
                    }, 1500));
                } else {
                    let tid = setTimeout(processTypeQueue, 50);
                    magicTimeouts.push(tid);
                }
            }
        }

        // FUNGSI STREAMING SULAP DENGAN BAHASA
        async function streamMagicClimax() {
            isMagicCancelled = false;
            streamFinished = false;
            typeQueue = "";
            const lang = config.language || 'id';
            const dict = i18n[lang];
            
            const btns = document.querySelectorAll('#answer-buttons-container button');
            const qNum = document.getElementById('question-number');
            const qText = document.getElementById('question-text');
            const chars = "!@#$%^&*()_+{}[]|:;<>,.?/~0123456789";

            qNum.style.display = 'none'; 
            qText.innerText = ""; 
            qText.classList.remove('text-center');
            qText.classList.add('text-left'); 
            document.getElementById('answer-buttons-container').classList.add('pointer-events-none');

            let scrambleInt = setInterval(() => {
                btns.forEach(btn => {
                    if (btn.dataset.locked !== "true") {
                        btn.innerText = Array(5).fill(0).map(() => chars[Math.floor(Math.random() * chars.length)]).join('');
                    }
                });
            }, 50);
            magicIntervals.push(scrambleInt);

            btns.forEach((btn, idx) => {
                let tid = setTimeout(() => {
                    btn.dataset.locked = "true";
                    btn.innerText = lang === 'en' ? "YES" : "YA";
                    btn.classList.add('btn-locked-horror');
                    if (navigator.vibrate) navigator.vibrate(50);
                    if (idx === btns.length - 1) clearInterval(scrambleInt);
                }, 600 + (idx * 400));
                magicTimeouts.push(tid);
            });

            document.body.classList.add('glitch-mild'); 
            qText.classList.add('typewriter-text');
            
            magicTimeouts.push(setTimeout(processTypeQueue, 1000));

            let prompt = "";
            if (lang === 'en') {
                prompt = `Playing a mind reading magic trick. Target: "${fetchedMagicName}". 
Assume the role of getting a more powerful mind reading power.
Say EXACTLY this sentence at the beginning: "For some reason I'm very confident this time, so I will directly access your mind..."
Add a new line, then describe specific physical traits or highly specific facts about this character as if you are divining them (max 3 short sentences, separated by new lines).
NEVER MENTION THE NAME. and use he/she to reffer to this character. DON'T EVER USE "YOU"
End with a new line and EXACTLY this sentence: "I already know.. you are thinking of.."
Write directly and naturally, no JSON, no formatting.`;
            } else {
                prompt = `Bermain trik sulap membaca pikiran. Target: "${fetchedMagicName}". 
Berperanlah seolah anda baru mendapat kekuatan membaca fikiran yang lebih besar.
Katakan tepat kalimat ini di awal: "Entah kenapa saya kali ini sangat yakin, jadi saya akan langsung mengakses pikiran anda..."
Beri baris baru, lalu deskripsikan ciri-ciri fisik atau fakta sangat spesifik dari tokoh ini seolah kamu sedang menerawang (maksimal 3 kalimat singkat, pisahkan dengan baris baru).
JANGAN PERNAH SEBUTKAN NAMANYA. gunakan kata "dia" untuk menyebut karakter ini. JANGAN PERNAH gunakan "Anda" atau semacamnya. 
Diakhiri dengan baris baru dan kalimat persis ini: "Saya sudah tau.. kamu sedang memikirkan.."
Tulis secara langsung sealami mungkin, tanpa JSON, tanpa format.`;
            }

            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/${config.aiModel}:streamGenerateContent?alt=sse&key=${config.customApiKey}`;
            
            try {
                const response = await fetch(apiUrl, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ role: "user", parts: [{ text: prompt }] }] })
                });

                if (!response.ok) throw new Error("API failed");

                streamReader = response.body.getReader();
                const decoder = new TextDecoder();
                let buffer = '';

                while (true) {
                    if (isMagicCancelled) { 
                        streamReader.cancel(); 
                        break; 
                    }
                    const { done, value } = await streamReader.read();
                    if (done) break;
                    
                    buffer += decoder.decode(value, { stream: true });
                    let lines = buffer.split('\n');
                    buffer = lines.pop(); 
                    
                    for (let line of lines) {
                        line = line.trim();
                        if (line.startsWith('data: ')) {
                            const dataStr = line.slice(6).trim();
                            if (dataStr === '[DONE]') continue; 
                            try {
                                const data = JSON.parse(dataStr);
                                const textPart = data.candidates?.[0]?.content?.parts?.[0]?.text;
                                if (textPart) {
                                    typeQueue += textPart;
                                }
                            } catch (e) {
                                console.error("Parse error:", e);
                            }
                        }
                    }
                }
            } catch (e) {
                console.error("Stream Error", e);
                typeQueue += (lang === 'en') 
                    ? "\n\n(Aura is too dark... connection lost...)\n\nI already know.. you are thinking of.."
                    : "\n\n(Aura terlalu gelap... koneksi terputus...)\n\nSaya sudah tau.. kamu sedang memikirkan..";
            } finally {
                streamFinished = true;
            }
        }

        function handleUserAnswer(btnIndex) {
            const lang = config.language || 'id';
            const answers = [i18n[lang].qProbably, i18n[lang].qProbablyNot, i18n[lang].qYes, i18n[lang].qDontKnow, i18n[lang].qNo];
            submitAnswer(answers[btnIndex]);
        }

        async function submitAnswer(answer) {
            if (isGameOver || isProcessing) return;
            isProcessing = true;
            document.getElementById('screen-game').style.opacity = '0.5';
            
            showLoading(true);
            
            currentQuestionIndex++;
            
            if (currentQuestionIndex < 10) { 
                const nextQ = await fetchNormalQuestion(answer);
                document.getElementById('screen-game').style.opacity = '1';
                showLoading(false);
                
                if (nextQ) {
                    document.getElementById('question-number').innerText = `${i18n[config.language || 'id'].question} ${currentQuestionIndex + 1}`;
                    document.getElementById('question-text').innerText = nextQ;
                    const jinImage = document.getElementById('jin-image');
                    jinImage.src = currentQuestionIndex % 2 === 0 ? "https://en.akinator.com/assets/img/akitudes_520x650/inspiration_forte.png" : "https://en.akinator.com/assets/img/akitudes_520x650/serein_2.png";
                } else {
                    showErrorDot(true);
                }
                isProcessing = false; 
            } else { 
                const guessData = await fetchNormalGuess(answer);
                document.getElementById('screen-game').style.opacity = '1';
                showLoading(false);
                
                if (guessData) {
                    fetchedMagicName = guessData.guess || "Misterius";
                    magicDescriptionsString = guessData.description || (config.language === 'en' ? "Akinator is tired of guessing." : "Akinator lelah menebak.");
                    showReveal();
                } else {
                    showErrorDot(true);
                    isProcessing = false;
                }
            }
        }

        async function showReveal() {
            document.body.classList.remove('glitch-mild'); 
            document.getElementById('guess-name').innerText = fetchedMagicName;
            
            if(isMagicMode) {
                document.getElementById('guess-desc').innerText = i18n[config.language || 'id'].magicDesc;
            } else {
                document.getElementById('guess-desc').innerText = magicDescriptionsString;
            }
            
            const imgEl = document.getElementById('guess-image'), fallbackEl = document.getElementById('no-image-fallback'), loadingEl = document.getElementById('image-loading');
            imgEl.classList.add('hidden'); fallbackEl.classList.add('hidden'); loadingEl.style.display = 'flex';
            showScreen('screen-guess');
            
            const imgUrl = await fetchCharacterImageFromInternet(fetchedMagicName);
            loadingEl.style.display = 'none';
            if (imgUrl) { imgEl.src = imgUrl; imgEl.onload = () => imgEl.classList.remove('hidden'); imgEl.onerror = () => fallbackEl.classList.remove('hidden'); } 
            else { fallbackEl.classList.remove('hidden'); }
        }

        function handleGuessResult(result) {
            isGameOver = true;
            const dict = i18n[config.language || 'id'];
            document.getElementById('end-title').innerText = result === 'yes' ? dict.endWin : dict.endLose;
            showScreen('screen-end');
        }

        function resetGame() { 
            clearMagicTimeouts();
            document.body.classList.remove('glitch-mild', 'glitch-extreme');
            showErrorDot(false); 
            isProcessing = false; 
            isGameOver = true; 
            
            isMagicMode = false;
            forcedTargetIndex = -1;
            t9InputString = "";
            waitingForMagicTrigger = false;
            
            showScreen('screen-start'); 
        }

        function stepperChange(id, delta) {
            const el = document.getElementById('input-' + id);
            let val = parseFloat(el.innerText) || 0;
            val = Math.max(0, Math.round((val + delta) * 10) / 10);
            el.innerText = val;
            if (navigator.vibrate) navigator.vibrate(15);
        }

        window.onload = () => { loadSettings(); showScreen('screen-start'); };
    </script>
</body>
</html>
